function mkRoute(kind,br,fc){const left=br*2.5,right=W-br*2.5,top=hh+55,bottom=H-95,mid=(top+bottom)/2;
let q;if(kind==='wave'){q=[[left,top],[right,top+22],[left,mid-55],[right,mid+20],[left,bottom-30],[W/2,bottom]]}
else if(kind==='diamond'){const cy=mid,r=Math.min((right-left)*.43,(bottom-top)*.4);q=[[W/2,top],[right,cy-r*.3],[W/2,bottom],[left,cy+r*.3],[W/2,cy-r*.48],[W/2,cy+r*.3]]}
else if(kind==='hexagon'||kind==='pentagon'||kind==='triangle'||kind==='square'){const sides={hexagon:6,pentagon:5,triangle:3,square:4}[kind],rx=(right-left)*.45,ry=(bottom-top)*.43;const pts=Array.from({length:sides},(_,i)=>{const a=-Math.PI/2+i*Math.PI*2/sides;return[W/2+rx*Math.cos(a),mid+ry*Math.sin(a)]});q=[...pts,pts[0],[W/2,mid]]}
else if(kind==='star'||kind==='crown'){const n=kind==='star'?5:7,pts=[];for(let i=0;i<n*2;i++){const a=-Math.PI/2+i*Math.PI/n,r=i%2?.43:1;pts.push([W/2+(right-left)*.45*r*Math.cos(a),mid+(bottom-top)*.43*r*Math.sin(a)])}q=[...pts,pts[0],[W/2,mid]]}
else if(kind==='hourglass'){q=[[left,top],[right,top],[left,bottom],[right,bottom],[left,top],[W/2,mid]]}
else if(kind==='zigzag'){q=[[left,top],[right,top+35],[left,mid-55],[right,mid],[left,mid+55],[right,bottom],[W/2,bottom-20]]}
else if(kind==='clover'||kind==='butterfly'||kind==='infinity'||kind==='orbit'){q=[];const n=150,rx=(right-left)*.45,ry=(bottom-top)*.40;for(let i=0;i<=n;i++){const a=i/n*Math.PI*2;let xx,yy;if(kind==='clover'){const r=.53+.43*Math.cos(4*a);xx=W/2+rx*r*Math.cos(a);yy=mid+ry*r*Math.sin(a)}else if(kind==='butterfly'){xx=W/2+rx*Math.sin(2*a)*.85;yy=mid+ry*Math.sin(a)*.88}else if(kind==='infinity'){xx=W/2+rx*Math.sin(a);yy=mid+ry*Math.sin(2*a)*.78}else{xx=W/2+rx*Math.cos(a);yy=mid+ry*Math.sin(a)}q.push([xx,yy])}q.push([W/2,mid])}
else{q=[[left,top],[right,top],[right,top+(bottom-top)*.25],[left+br*3,top+(bottom-top)*.25],[left+br*3,mid],[right-br*3,mid],[right-br*3,bottom-(bottom-top)*.25],[left,bottom-(bottom-top)*.25],[left,bottom],[W/2,bottom]]}
const px=[],py=[];for(let i=1;i<q.length;i++){const a=q[i-1],b=q[i],dist=Math.hypot(b[0]-a[0],b[1]-a[1]),steps=Math.max(1,Math.ceil(dist/3));for(let j=0;j<steps;j++){const u=j/steps;px.push(a[0]+(b[0]-a[0])*u);py.push(a[1]+(b[1]-a[1])*u)}}px.push(q[q.length-1][0]);py.push(q[q.length-1][1]);return{rm:0,BR:br,SP:br*2,CX:q[q.length-1][0],CY:q[q.length-1][1],ch:[],sq:[],lastC:-1,rev:0,revCd:0,helpCd:0,spd:1,fc,PX:px,PY:py,Ltot:(px.length-1)*3}}

function samplePath(points){
 const out=[points[0]];let carry=0;
 for(let i=1;i<points.length;i++){
  let a=points[i-1],b=points[i],len=Math.hypot(b[0]-a[0],b[1]-a[1]);
  if(!len)continue;const ux=(b[0]-a[0])/len,uy=(b[1]-a[1])/len;
  let at=3-carry;for(;at<=len;at+=3)out.push([a[0]+ux*at,a[1]+uy*at]);
  carry=len-(at-3);
 }return out;
}
